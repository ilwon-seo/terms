<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title description">
  <title id="title">Illustration of an exploding gradient and norm clipping</title>
  <desc id="description">An illustrative scalar gradient is multiplied by 3 at each of four layers, growing from 1 to 81. Global norm clipping with threshold 10 scales a gradient of magnitude 81 down to magnitude 10.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
      .title { font-size: 23px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .node-title { font-size: 13px; font-weight: 700; }
      .value { font-size: 20px; font-weight: 700; }
      .step { font-size: 13px; fill: #4b5563; }
      .formula { font-size: 16px; font-weight: 700; }
    </style>
  </defs>
  <rect width="900" height="390" fill="#ffffff"/>
  <text class="title" x="450" y="37" text-anchor="middle">Repeated large derivatives can amplify gradients</text>
  <text class="subtitle" x="450" y="62" text-anchor="middle">Illustrative scalar chain: each local derivative is 3</text>

  <g fill="#fff7ed" stroke="#fdba74" stroke-width="1.5">
    <rect x="28" y="100" width="140" height="91" rx="11"/>
    <rect x="205" y="100" width="140" height="91" rx="11"/>
    <rect x="382" y="100" width="140" height="91" rx="11"/>
    <rect x="559" y="100" width="140" height="91" rx="11"/>
    <rect x="736" y="100" width="140" height="91" rx="11"/>
  </g>
  <g text-anchor="middle">
    <text class="node-title" x="98" y="127">Output gradient</text>
    <text class="value" x="98" y="161">1</text>
    <text class="node-title" x="275" y="127">After 1 layer</text>
    <text class="value" x="275" y="161">3</text>
    <text class="node-title" x="452" y="127">After 2 layers</text>
    <text class="value" x="452" y="161">9</text>
    <text class="node-title" x="629" y="127">After 3 layers</text>
    <text class="value" x="629" y="161">27</text>
    <text class="node-title" x="806" y="127">Early layer</text>
    <text class="value" x="806" y="161">81</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="168" y1="146" x2="195" y2="146"/>
    <line x1="345" y1="146" x2="372" y2="146"/>
    <line x1="522" y1="146" x2="549" y2="146"/>
    <line x1="699" y1="146" x2="726" y2="146"/>
  </g>
  <g class="step" text-anchor="middle">
    <text x="181" y="214">× 3</text>
    <text x="358" y="214">× 3</text>
    <text x="535" y="214">× 3</text>
    <text x="712" y="214">× 3</text>
  </g>
  <text class="subtitle" x="450" y="244" text-anchor="middle">Backpropagation direction: output → earlier layers</text>

  <rect x="120" y="272" width="660" height="82" rx="11" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text class="node-title" x="450" y="296" text-anchor="middle">Global norm clipping example (threshold τ = 10)</text>
  <text class="formula" x="450" y="326" text-anchor="middle">Gradient norm 81 → clipped gradient norm 10</text>
  <text class="subtitle" x="450" y="346" text-anchor="middle">Clipping limits magnitude; it does not remove the cause of growth.</text>
</svg>
