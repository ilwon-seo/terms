<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title description">
  <title id="title">Validation loss for three illustrative learning rates</title>
  <desc id="description">A bar chart compares validation losses 0.42, 0.31, and 0.35 for learning rates 0.1, 0.01, and 0.001 respectively. Lower is better, so 0.01 is preferred among these three illustrative candidates.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .label { font-size: 15px; }
    .value { font-size: 14px; font-weight: 700; }
    .tick { font-size: 12px; fill: #4b5563; }
  </style>
  <rect width="820" height="390" fill="#ffffff"/>
  <text class="title" x="410" y="36" text-anchor="middle">Compare validation loss across hyperparameter values</text>
  <text class="subtitle" x="410" y="60" text-anchor="middle">Illustrative values; lower validation loss is better</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="250" y1="100" x2="250" y2="310"/>
    <line x1="330" y1="100" x2="330" y2="310"/>
    <line x1="410" y1="100" x2="410" y2="310"/>
    <line x1="490" y1="100" x2="490" y2="310"/>
    <line x1="570" y1="100" x2="570" y2="310"/>
    <line x1="650" y1="100" x2="650" y2="310"/>
  </g>
  <text class="label" x="70" y="145">Learning rate 0.1</text>
  <text class="label" x="70" y="215">Learning rate 0.01</text>
  <text class="label" x="70" y="285">Learning rate 0.001</text>

  <rect x="250" y="120" width="336" height="34" rx="5" fill="#94a3b8"/>
  <rect x="250" y="190" width="248" height="34" rx="5" fill="#16a34a"/>
  <rect x="250" y="260" width="280" height="34" rx="5" fill="#94a3b8"/>
  <text class="value" x="596" y="142">0.42</text>
  <text class="value" x="508" y="212">0.31</text>
  <text class="value" x="540" y="282">0.35</text>

  <line x1="250" y1="310" x2="650" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <g class="tick" text-anchor="middle">
    <text x="250" y="333">0.0</text>
    <text x="330" y="333">0.1</text>
    <text x="410" y="333">0.2</text>
    <text x="490" y="333">0.3</text>
    <text x="570" y="333">0.4</text>
    <text x="650" y="333">0.5</text>
  </g>
  <text class="subtitle" x="450" y="366" text-anchor="middle">Among these candidates, learning rate 0.01 has the lowest validation loss.</text>
</svg>
