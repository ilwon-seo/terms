<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Recall from actual positive cases</title>
  <desc id="desc">In an illustrative set of 10 actual positive cases, 7 are correctly detected and 3 are false negatives. Recall is 7 divided by 10, or 70 percent.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .label { font-size: 17px; }
    .strong { font-size: 21px; font-weight: 700; }
    .small { font-size: 15px; fill: #4b5563; }
  </style>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="25" font-weight="700">Recall evaluates actual positive cases</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#4b5563">Illustrative example — 10 actual positives, not measured data</text>

  <text class="label" x="450" y="133" text-anchor="middle">Actual positive: 10 cases</text>
  <rect x="150" y="157" width="420" height="78" rx="8" fill="#e8f4ec" stroke="#3b8053" stroke-width="2"/>
  <rect x="570" y="157" width="180" height="78" rx="8" fill="#fff3df" stroke="#bd7a19" stroke-width="2"/>
  <text class="strong" x="360" y="190" text-anchor="middle">7 true positives (TP)</text>
  <text class="small" x="360" y="216" text-anchor="middle">correctly detected</text>
  <text class="strong" x="660" y="190" text-anchor="middle">3 FN</text>
  <text class="small" x="660" y="216" text-anchor="middle">missed positives</text>

  <text class="label" x="450" y="282" text-anchor="middle">Recall = correctly detected positives / all actual positives</text>
  <text x="450" y="334" text-anchor="middle" font-size="28" font-weight="700" fill="#28613a">7 / (7 + 3) = 70%</text>
  <text class="small" x="450" y="382" text-anchor="middle">The denominator includes both detected and missed positives.</text>
</svg>
