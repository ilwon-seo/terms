<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Reproducing a machine-learning experiment</title>
  <desc id="description">A documented experiment recipe records code, data, configuration, and evaluation. It supports both the original run and an independent rerun. Their hypothetical scores, 0.91 and approximately 0.91, are compared. Similar results provide evidence of reproducibility, but do not by themselves prove generalization or validity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
      .title { font-size: 23px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .heading { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .score { font-size: 20px; font-weight: 700; }
      .note { font-size: 13px; fill: #4b5563; }
    </style>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text class="title" x="450" y="38" text-anchor="middle">Can the reported result be reproduced?</text>
  <text class="subtitle" x="450" y="63" text-anchor="middle">Record an experiment recipe, rerun it, then compare the results</text>

  <rect x="295" y="88" width="310" height="108" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="heading" x="450" y="116" text-anchor="middle">Documented experiment</text>
  <text class="body" x="450" y="142" text-anchor="middle">Code + data + configuration</text>
  <text class="body" x="450" y="165" text-anchor="middle">Preprocessing + evaluation procedure</text>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="370" y1="196" x2="235" y2="244"/>
    <line x1="530" y1="196" x2="665" y2="244"/>
    <line x1="235" y1="322" x2="360" y2="376"/>
    <line x1="665" y1="322" x2="540" y2="376"/>
  </g>

  <rect x="90" y="244" width="290" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="heading" x="235" y="273" text-anchor="middle">Original run</text>
  <text class="body" x="235" y="300" text-anchor="middle">Reported score: 0.91</text>

  <rect x="520" y="244" width="290" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="heading" x="665" y="273" text-anchor="middle">Independent rerun</text>
  <text class="body" x="665" y="300" text-anchor="middle">Rerun score: approximately 0.91</text>

  <rect x="260" y="376" width="380" height="67" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="450" y="405" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Similar results support reproducibility</text>
  <text class="note" x="450" y="428" text-anchor="middle">Define how results will be compared; no universal tolerance is implied.</text>

  <text class="note" x="450" y="475" text-anchor="middle">Illustrative scores only. Reproducibility alone does not establish model validity or generalization.</text>
</svg>
