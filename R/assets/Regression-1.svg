<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">Conceptual regression fit</title>
  <desc id="description">Illustrative numeric observations are shown as points, with a fitted curve representing predicted target values as an input feature changes.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .label { font-size: 15px; }
    .small { font-size: 14px; fill: #4b5563; }
  </style>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="700">Regression predicts a quantitative target</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Conceptual illustration — values are not measured data</text>

  <g stroke="#e0e5ea" stroke-width="1">
    <line x1="150" y1="440" x2="780" y2="440"/>
    <line x1="150" y1="365" x2="780" y2="365"/>
    <line x1="150" y1="290" x2="780" y2="290"/>
    <line x1="150" y1="215" x2="780" y2="215"/>
    <line x1="150" y1="140" x2="780" y2="140"/>
    <line x1="150" y1="140" x2="150" y2="440"/>
    <line x1="307.5" y1="140" x2="307.5" y2="440"/>
    <line x1="465" y1="140" x2="465" y2="440"/>
    <line x1="622.5" y1="140" x2="622.5" y2="440"/>
    <line x1="780" y1="140" x2="780" y2="440"/>
  </g>
  <g stroke="#374151" stroke-width="2">
    <line x1="150" y1="140" x2="150" y2="440"/>
    <line x1="150" y1="440" x2="780" y2="440"/>
  </g>

  <path d="M170 395 C260 375, 300 340, 365 325 S470 285, 535 270 S650 215, 760 180" fill="none" stroke="#0072B2" stroke-width="4" stroke-linecap="round"/>
  <g fill="#d55e00" stroke="#ffffff" stroke-width="2">
    <circle cx="190" cy="405" r="7"/>
    <circle cx="245" cy="365" r="7"/>
    <circle cx="300" cy="372" r="7"/>
    <circle cx="355" cy="318" r="7"/>
    <circle cx="415" cy="341" r="7"/>
    <circle cx="470" cy="290" r="7"/>
    <circle cx="525" cy="300" r="7"/>
    <circle cx="585" cy="246" r="7"/>
    <circle cx="645" cy="265" r="7"/>
    <circle cx="705" cy="203" r="7"/>
    <circle cx="755" cy="193" r="7"/>
  </g>

  <g class="small" text-anchor="middle">
    <text x="150" y="465">low</text>
    <text x="465" y="465">input values</text>
    <text x="780" y="465">high</text>
  </g>
  <text class="label" x="465" y="505" text-anchor="middle">Input feature</text>
  <text class="label" x="48" y="290" transform="rotate(-90 48 290)" text-anchor="middle">Quantitative target</text>

  <line x1="570" y1="115" x2="615" y2="115" stroke="#0072B2" stroke-width="4"/>
  <text class="small" x="625" y="120">Fitted model</text>
  <circle cx="735" cy="115" r="7" fill="#d55e00"/>
  <text class="small" x="750" y="120">Observed value</text>
</svg>
