<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img" aria-labelledby="title description">
  <title id="title">Anscombe's quartet regression plots</title>
  <desc id="description">Four scatterplots of Anscombe's quartet on common axes, each with the approximate same fitted line y equals 3 plus 0.5 times x. The point patterns differ despite similar summary statistics and regression lines.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .axis { stroke: #4b5563; stroke-width: 1.5; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .fit { stroke: #0072B2; stroke-width: 2.5; }
    .point { fill: #d55e00; stroke: #ffffff; stroke-width: 1; }
    .tick { font-size: 11px; fill: #4b5563; }
    .panel-title { font-size: 15px; font-weight: 700; }
  </style>
  <rect width="920" height="700" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="24" font-weight="700">Anscombe's quartet: similar fits, different data patterns</text>
  <text x="460" y="59" text-anchor="middle" font-size="14" fill="#4b5563">Each panel shows 11 observations and the approximate common line y = 3 + 0.5x</text>

  <g transform="translate(70,95)">
    <text class="panel-title" x="170" y="-10" text-anchor="middle">I</text>
    <g class="grid">
      <line x1="30" y1="180" x2="310" y2="180"/><line x1="30" y1="120" x2="310" y2="120"/><line x1="30" y1="60" x2="310" y2="60"/><line x1="30" y1="0" x2="310" y2="0"/>
      <line x1="30" y1="0" x2="30" y2="180"/><line x1="96" y1="0" x2="96" y2="180"/><line x1="162" y1="0" x2="162" y2="180"/><line x1="228" y1="0" x2="228" y2="180"/><line x1="294" y1="0" x2="294" y2="180"/>
    </g>
    <g class="axis"><line x1="30" y1="0" x2="30" y2="180"/><line x1="30" y1="180" x2="310" y2="180"/></g>
    <g class="tick"><text x="30" y="196" text-anchor="middle">4</text><text x="96" y="196" text-anchor="middle">8</text><text x="162" y="196" text-anchor="middle">12</text><text x="228" y="196" text-anchor="middle">16</text><text x="294" y="196" text-anchor="middle">20</text><text x="22" y="184" text-anchor="end">2</text><text x="22" y="124" text-anchor="end">6</text><text x="22" y="64" text-anchor="end">10</text><text x="22" y="4" text-anchor="end">14</text></g>
    <line class="fit" x1="30" y1="135" x2="294" y2="15"/>
    <g class="point"><circle cx="129" cy="74.5" r="4"/><circle cx="96" cy="88.1" r="4"/><circle cx="178.5" cy="80.3" r="4"/><circle cx="112.5" cy="64.9" r="4"/><circle cx="145.5" cy="70.9" r="4"/><circle cx="195" cy="50.5" r="4"/><circle cx="63" cy="84.5" r="4"/><circle cx="30" cy="121.8" r="4"/><circle cx="162" cy="39.5" r="4"/><circle cx="79.5" cy="114.8" r="4"/><circle cx="46.5" cy="104" r="4"/></g>
  </g>

  <g transform="translate(520,95)">
    <text class="panel-title" x="170" y="-10" text-anchor="middle">II</text>
    <g class="grid">
      <line x1="30" y1="180" x2="310" y2="180"/><line x1="30" y1="120" x2="310" y2="120"/><line x1="30" y1="60" x2="310" y2="60"/><line x1="30" y1="0" x2="310" y2="0"/>
      <line x1="30" y1="0" x2="30" y2="180"/><line x1="96" y1="0" x2="96" y2="180"/><line x1="162" y1="0" x2="162" y2="180"/><line x1="228" y1="0" x2="228" y2="180"/><line x1="294" y1="0" x2="294" y2="180"/>
    </g>
    <g class="axis"><line x1="30" y1="0" x2="30" y2="180"/><line x1="30" y1="180" x2="310" y2="180"/></g>
    <g class="tick"><text x="30" y="196" text-anchor="middle">4</text><text x="96" y="196" text-anchor="middle">8</text><text x="162" y="196" text-anchor="middle">12</text><text x="228" y="196" text-anchor="middle">16</text><text x="294" y="196" text-anchor="middle">20</text><text x="22" y="184" text-anchor="end">2</text><text x="22" y="124" text-anchor="end">6</text><text x="22" y="64" text-anchor="end">10</text><text x="22" y="4" text-anchor="end">14</text></g>
    <line class="fit" x1="30" y1="135" x2="294" y2="15"/>
    <g class="point"><circle cx="129" cy="60.8" r="4"/><circle cx="96" cy="73.3" r="4"/><circle cx="178.5" cy="65.8" r="4"/><circle cx="112.5" cy="65.4" r="4"/><circle cx="145.5" cy="59.3" r="4"/><circle cx="195" cy="73.8" r="4"/><circle cx="63" cy="98.4" r="4"/><circle cx="30" cy="136.3" r="4"/><circle cx="162" cy="60.9" r="4"/><circle cx="79.5" cy="84.3" r="4"/><circle cx="46.5" cy="115.8" r="4"/></g>
  </g>

  <g transform="translate(70,395)">
    <text class="panel-title" x="170" y="-10" text-anchor="middle">III</text>
    <g class="grid">
      <line x1="30" y1="180" x2="310" y2="180"/><line x1="30" y1="120" x2="310" y2="120"/><line x1="30" y1="60" x2="310" y2="60"/><line x1="30" y1="0" x2="310" y2="0"/>
      <line x1="30" y1="0" x2="30" y2="180"/><line x1="96" y1="0" x2="96" y2="180"/><line x1="162" y1="0" x2="162" y2="180"/><line x1="228" y1="0" x2="228" y2="180"/><line x1="294" y1="0" x2="294" y2="180"/>
    </g>
    <g class="axis"><line x1="30" y1="0" x2="30" y2="180"/><line x1="30" y1="180" x2="310" y2="180"/></g>
    <g class="tick"><text x="30" y="196" text-anchor="middle">4</text><text x="96" y="196" text-anchor="middle">8</text><text x="162" y="196" text-anchor="middle">12</text><text x="228" y="196" text-anchor="middle">16</text><text x="294" y="196" text-anchor="middle">20</text><text x="22" y="184" text-anchor="end">2</text><text x="22" y="124" text-anchor="end">6</text><text x="22" y="64" text-anchor="end">10</text><text x="22" y="4" text-anchor="end">14</text></g>
    <line class="fit" x1="30" y1="135" x2="294" y2="15"/>
    <g class="point"><circle cx="129" cy="81.8" r="4"/><circle cx="96" cy="90.4" r="4"/><circle cx="178.5" cy="15.8" r="4"/><circle cx="112.5" cy="86.1" r="4"/><circle cx="145.5" cy="77.4" r="4"/><circle cx="195" cy="64.5" r="4"/><circle cx="63" cy="99" r="4"/><circle cx="30" cy="107.6" r="4"/><circle cx="162" cy="73.1" r="4"/><circle cx="79.5" cy="94.8" r="4"/><circle cx="46.5" cy="103.4" r="4"/></g>
  </g>

  <g transform="translate(520,395)">
    <text class="panel-title" x="170" y="-10" text-anchor="middle">IV</text>
    <g class="grid">
      <line x1="30" y1="180" x2="310" y2="180"/><line x1="30" y1="120" x2="310" y2="120"/><line x1="30" y1="60" x2="310" y2="60"/><line x1="30" y1="0" x2="310" y2="0"/>
      <line x1="30" y1="0" x2="30" y2="180"/><line x1="96" y1="0" x2="96" y2="180"/><line x1="162" y1="0" x2="162" y2="180"/><line x1="228" y1="0" x2="228" y2="180"/><line x1="294" y1="0" x2="294" y2="180"/>
    </g>
    <g class="axis"><line x1="30" y1="0" x2="30" y2="180"/><line x1="30" y1="180" x2="310" y2="180"/></g>
    <g class="tick"><text x="30" y="196" text-anchor="middle">4</text><text x="96" y="196" text-anchor="middle">8</text><text x="162" y="196" text-anchor="middle">12</text><text x="228" y="196" text-anchor="middle">16</text><text x="294" y="196" text-anchor="middle">20</text><text x="22" y="184" text-anchor="end">2</text><text x="22" y="124" text-anchor="end">6</text><text x="22" y="64" text-anchor="end">10</text><text x="22" y="4" text-anchor="end">14</text></g>
    <line class="fit" x1="30" y1="135" x2="294" y2="15"/>
    <g class="point"><circle cx="96" cy="92.8" r="4"/><circle cx="96" cy="103" r="4"/><circle cx="96" cy="78.6" r="4"/><circle cx="96" cy="64.5" r="4"/><circle cx="96" cy="69.1" r="4"/><circle cx="96" cy="87" r="4"/><circle cx="96" cy="109.4" r="4"/><circle cx="277.5" cy="18.8" r="4"/><circle cx="96" cy="105.5" r="4"/><circle cx="96" cy="76.1" r="4"/><circle cx="96" cy="88.9" r="4"/></g>
  </g>

  <line class="fit" x1="340" y1="660" x2="385" y2="660"/>
  <text x="395" y="665" font-size="13" fill="#4b5563">Approximate common fitted line</text>
  <circle class="point" cx="605" cy="660" r="5"/>
  <text x="617" y="665" font-size="13" fill="#4b5563">Published observation</text>
</svg>
