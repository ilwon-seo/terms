<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title description">
  <title id="title">Conceptual receiver operating characteristic curve</title>
  <desc id="description">A qualitative ROC curve plots true positive rate against false positive rate. Marked operating points correspond to a high, medium, and lower decision threshold. A diagonal line shows the random-ranking reference.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .label { font-size: 15px; }
    .small { font-size: 14px; fill: #4b5563; }
  </style>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="700">ROC curve across decision thresholds</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#4b5563">Conceptual illustration — rates are qualitative, not measured</text>

  <g stroke="#e0e5ea" stroke-width="1">
    <line x1="140" y1="470" x2="760" y2="470"/>
    <line x1="140" y1="387.5" x2="760" y2="387.5"/>
    <line x1="140" y1="305" x2="760" y2="305"/>
    <line x1="140" y1="222.5" x2="760" y2="222.5"/>
    <line x1="140" y1="140" x2="760" y2="140"/>
    <line x1="140" y1="140" x2="140" y2="470"/>
    <line x1="295" y1="140" x2="295" y2="470"/>
    <line x1="450" y1="140" x2="450" y2="470"/>
    <line x1="605" y1="140" x2="605" y2="470"/>
    <line x1="760" y1="140" x2="760" y2="470"/>
  </g>
  <g stroke="#374151" stroke-width="2">
    <line x1="140" y1="140" x2="140" y2="470"/>
    <line x1="140" y1="470" x2="760" y2="470"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="140" y="493">0.0</text>
    <text x="295" y="493">0.25</text>
    <text x="450" y="493">0.50</text>
    <text x="605" y="493">0.75</text>
    <text x="760" y="493">1.0</text>
  </g>
  <g class="small" text-anchor="end">
    <text x="128" y="475">0.0</text>
    <text x="128" y="392">0.25</text>
    <text x="128" y="310">0.50</text>
    <text x="128" y="228">0.75</text>
    <text x="128" y="145">1.0</text>
  </g>
  <text class="label" x="450" y="530" text-anchor="middle">False positive rate (FPR)</text>
  <text class="label" x="40" y="305" transform="rotate(-90 40 305)" text-anchor="middle">True positive rate (TPR)</text>

  <line x1="140" y1="470" x2="760" y2="140" stroke="#7b8794" stroke-width="2" stroke-dasharray="8 7"/>
  <text class="small" x="618" y="246" transform="rotate(-28 618 246)">Random-ranking reference</text>

  <polyline points="140,470 165,374 215,305 295,225 425,180 590,153 760,140" fill="none" stroke="#0072B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0072B2" stroke="#ffffff" stroke-width="2">
    <circle cx="165" cy="374" r="7"/>
    <circle cx="295" cy="225" r="7"/>
    <circle cx="590" cy="153" r="7"/>
  </g>
  <text class="label" x="174" y="367">High threshold</text>
  <text class="label" x="305" y="216">Medium threshold</text>
  <text class="label" x="596" y="142">Lower threshold</text>
  <text class="small" x="450" y="570" text-anchor="middle">Each point represents one threshold applied to classifier scores.</text>
</svg>
