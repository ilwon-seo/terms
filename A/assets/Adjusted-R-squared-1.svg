<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title description">
  <title id="title">Adjusted R-squared comparison for two illustrative models</title>
  <desc id="description">For two models fitted to the same ten observations, model one has two predictors, R-squared 0.80, and adjusted R-squared about 0.743. Model two has three predictors, R-squared 0.81, and adjusted R-squared 0.715. The small increase in R-squared does not offset the added predictor's degrees-of-freedom cost.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .label { font-size: 15px; }
    .value { font-size: 14px; font-weight: 700; }
    .tick { font-size: 12px; fill: #4b5563; }
    .note { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="860" height="420" fill="#ffffff"/>
  <text class="title" x="430" y="38" text-anchor="middle">A small R² gain can be outweighed by model complexity</text>
  <text class="subtitle" x="430" y="64" text-anchor="middle">Illustrative nested OLS models with an intercept, both fitted to n = 10 observations</text>

  <rect x="28" y="91" width="804" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="225" y="108" width="15" height="15" rx="3" fill="#2563eb"/>
  <text class="subtitle" x="247" y="121">R-squared</text>
  <rect x="345" y="108" width="15" height="15" rx="3" fill="#f97316"/>
  <text class="subtitle" x="367" y="121">Adjusted R-squared</text>

  <text class="label" x="48" y="165">Model 1</text>
  <text class="subtitle" x="48" y="185">p = 2</text>
  <text class="subtitle" x="48" y="205">R²adj = 0.743</text>
  <rect x="225" y="145" width="400" height="22" rx="4" fill="#2563eb"/>
  <text class="value" x="635" y="162">0.80</text>
  <rect x="225" y="175" width="371.4" height="22" rx="4" fill="#f97316"/>
  <text class="value" x="606" y="192">0.743</text>

  <text class="label" x="48" y="245">Model 2</text>
  <text class="subtitle" x="48" y="265">p = 3</text>
  <text class="subtitle" x="48" y="285">R²adj = 0.715</text>
  <rect x="225" y="225" width="405" height="22" rx="4" fill="#2563eb"/>
  <text class="value" x="640" y="242">0.81</text>
  <rect x="225" y="255" width="357.5" height="22" rx="4" fill="#f97316"/>
  <text class="value" x="588" y="272">0.715</text>

  <line x1="225" y1="318" x2="725" y2="318" stroke="#64748b" stroke-width="1"/>
  <g stroke="#64748b" stroke-width="1">
    <line x1="225" y1="314" x2="225" y2="323"/>
    <line x1="350" y1="314" x2="350" y2="323"/>
    <line x1="475" y1="314" x2="475" y2="323"/>
    <line x1="600" y1="314" x2="600" y2="323"/>
    <line x1="725" y1="314" x2="725" y2="323"/>
  </g>
  <text class="tick" x="225" y="340" text-anchor="middle">0</text>
  <text class="tick" x="350" y="340" text-anchor="middle">0.25</text>
  <text class="tick" x="475" y="340" text-anchor="middle">0.50</text>
  <text class="tick" x="600" y="340" text-anchor="middle">0.75</text>
  <text class="tick" x="725" y="340" text-anchor="middle">1.00</text>

  <text class="note" x="430" y="378" text-anchor="middle">R² rises from 0.80 to 0.81, while adjusted R² falls from 0.743 to 0.715.</text>
</svg>
