<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Training and validation error as model flexibility increases</title>
  <desc id="description">A conceptual chart. Training error decreases as model flexibility grows. Validation error first decreases, then rises. Underfitting is marked at low flexibility, a better fit near the validation-error minimum, and overfitting at high flexibility.</desc>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202124">Model flexibility and prediction error</text>
  <text x="480" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Conceptual illustration — values are qualitative, not measured data</text>

  <line x1="615" y1="98" x2="653" y2="98" stroke="#0072B2" stroke-width="4"/>
  <circle cx="634" cy="98" r="4" fill="#0072B2"/>
  <text x="663" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#202124">Training error</text>
  <line x1="785" y1="98" x2="823" y2="98" stroke="#D55E00" stroke-width="4"/>
  <circle cx="804" cy="98" r="4" fill="#D55E00"/>
  <text x="833" y="103" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#202124">Validation error</text>

  <rect x="130" y="135" width="215" height="315" fill="#FDECEC"/>
  <rect x="345" y="135" width="220" height="315" fill="#EAF4EA"/>
  <rect x="565" y="135" width="305" height="315" fill="#FFF2E5"/>

  <g stroke="#d7dce2" stroke-width="1">
    <line x1="130" y1="450" x2="870" y2="450"/>
    <line x1="130" y1="345" x2="870" y2="345"/>
    <line x1="130" y1="240" x2="870" y2="240"/>
    <line x1="130" y1="135" x2="870" y2="135"/>
  </g>
  <g stroke="#374151" stroke-width="2">
    <line x1="130" y1="135" x2="130" y2="450"/>
    <line x1="130" y1="450" x2="870" y2="450"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151" text-anchor="end">
    <text x="118" y="455">0.0</text>
    <text x="118" y="350">0.3</text>
    <text x="118" y="245">0.6</text>
    <text x="118" y="140">0.9</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="130" y="473">1</text>
    <text x="294" y="473">3</text>
    <text x="459" y="473">5</text>
    <text x="623" y="473">7</text>
    <text x="788" y="473">9</text>
    <text x="870" y="473">10</text>
  </g>
  <text x="500" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">Model flexibility</text>
  <text x="35" y="295" transform="rotate(-90 35 295)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#202124">Illustrative error</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="237" y="128" font-size="16" font-weight="700" fill="#8b3030">Underfitting</text>
    <text x="455" y="128" font-size="16" font-weight="700" fill="#28613a">Better fit</text>
    <text x="714" y="128" font-size="16" font-weight="700" fill="#8a4b16">Overfitting</text>
  </g>

  <polyline points="130,177 212,222 294,264 376,303 459,338 541,362 623,383 706,401 788,415 870,422" fill="none" stroke="#0072B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="130,152 212,198 294,240 376,275 459,303 541,317 623,310 706,282 788,233 870,170" fill="none" stroke="#D55E00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0072B2">
    <circle cx="130" cy="177" r="4"/><circle cx="212" cy="222" r="4"/><circle cx="294" cy="264" r="4"/><circle cx="376" cy="303" r="4"/><circle cx="459" cy="338" r="4"/><circle cx="541" cy="362" r="4"/><circle cx="623" cy="383" r="4"/><circle cx="706" cy="401" r="4"/><circle cx="788" cy="415" r="4"/><circle cx="870" cy="422" r="4"/>
  </g>
  <g fill="#D55E00">
    <circle cx="130" cy="152" r="4"/><circle cx="212" cy="198" r="4"/><circle cx="294" cy="240" r="4"/><circle cx="376" cy="275" r="4"/><circle cx="459" cy="303" r="4"/><circle cx="541" cy="317" r="4"/><circle cx="623" cy="310" r="4"/><circle cx="706" cy="282" r="4"/><circle cx="788" cy="233" r="4"/><circle cx="870" cy="170" r="4"/>
  </g>
</svg>
