<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title description">
  <title id="title">Illustrative SHAP value waterfall</title>
  <desc id="description">Starting from a baseline model output of 0.50, three feature attributions add 0.20, add 0.10, and subtract 0.05, giving a final output of 0.75. The values are illustrative.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .label { font-size: 14px; }
    .value { font-size: 14px; font-weight: 700; }
    .tick { font-size: 12px; fill: #4b5563; }
    .note { font-size: 13px; fill: #4b5563; }
  </style>
  <rect width="900" height="470" fill="#ffffff"/>
  <text class="title" x="450" y="36" text-anchor="middle">SHAP values add up from a baseline to one prediction</text>
  <text class="subtitle" x="450" y="60" text-anchor="middle">Hypothetical example on a model-output scale from 0 to 1</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="230" y1="96" x2="230" y2="370"/>
    <line x1="380" y1="96" x2="380" y2="370"/>
    <line x1="530" y1="96" x2="530" y2="370"/>
    <line x1="680" y1="96" x2="680" y2="370"/>
    <line x1="830" y1="96" x2="830" y2="370"/>
  </g>

  <text class="label" x="35" y="125">Baseline output</text>
  <text class="label" x="35" y="185">Feature A</text>
  <text class="label" x="35" y="245">Feature B</text>
  <text class="label" x="35" y="305">Feature C</text>
  <text class="label" x="35" y="365">Final prediction</text>

  <rect x="230" y="104" width="375" height="28" rx="4" fill="#64748b"/>
  <text class="value" x="613" y="123">0.50</text>

  <line x1="605" y1="132" x2="605" y2="164" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="605" y="164" width="150" height="28" rx="4" fill="#16a34a"/>
  <text class="value" x="685" y="183" text-anchor="middle">+0.20</text>

  <line x1="755" y1="192" x2="755" y2="224" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="755" y="224" width="75" height="28" rx="4" fill="#16a34a"/>
  <text class="value" x="792" y="243" text-anchor="middle">+0.10</text>

  <line x1="830" y1="252" x2="830" y2="284" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="792.5" y="284" width="37.5" height="28" rx="4" fill="#dc2626"/>
  <text class="value" x="785" y="303" text-anchor="end">-0.05</text>

  <rect x="230" y="344" width="562.5" height="28" rx="4" fill="#2563eb"/>
  <text class="value" x="800" y="363">0.75</text>

  <line x1="230" y1="388" x2="830" y2="388" stroke="#64748b" stroke-width="1.5"/>
  <g class="tick" text-anchor="middle">
    <text x="230" y="410">0.0</text>
    <text x="380" y="410">0.2</text>
    <text x="530" y="410">0.4</text>
    <text x="680" y="410">0.6</text>
    <text x="830" y="410">0.8</text>
  </g>
  <text class="note" x="450" y="448" text-anchor="middle">0.50 + 0.20 + 0.10 - 0.05 = 0.75</text>
</svg>
