<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title description">
  <title id="title">How mean squared error combines residuals</title>
  <desc id="description">The upper chart shows four actual and predicted values with residual gaps. The lower chart shows their squared errors, 0.25, 0.25, 0, and 1, whose mean is 0.375.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .label { font-size: 15px; }
    .small { font-size: 13px; fill: #4b5563; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700">MSE squares each residual before averaging</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#4b5563">Values from the scikit-learn documentation example</text>

  <text x="75" y="105" font-size="17" font-weight="700">Observed and predicted values</text>
  <g class="grid">
    <line x1="150" y1="290" x2="750" y2="290"/>
    <line x1="150" y1="258" x2="750" y2="258"/>
    <line x1="150" y1="226" x2="750" y2="226"/>
    <line x1="150" y1="194" x2="750" y2="194"/>
    <line x1="150" y1="162" x2="750" y2="162"/>
    <line x1="150" y1="130" x2="750" y2="130"/>
    <line x1="220" y1="120" x2="220" y2="300"/>
    <line x1="360" y1="120" x2="360" y2="300"/>
    <line x1="500" y1="120" x2="500" y2="300"/>
    <line x1="640" y1="120" x2="640" y2="300"/>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="150" y1="120" x2="150" y2="300"/>
    <line x1="150" y1="300" x2="750" y2="300"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="220" y="319">1</text>
    <text x="360" y="319">2</text>
    <text x="500" y="319">3</text>
    <text x="640" y="319">4</text>
    <text x="142" y="294" text-anchor="end">-1</text>
    <text x="142" y="262" text-anchor="end">1</text>
    <text x="142" y="230" text-anchor="end">3</text>
    <text x="142" y="198" text-anchor="end">5</text>
    <text x="142" y="166" text-anchor="end">7</text>
    <text x="142" y="134" text-anchor="end">9</text>
  </g>
  <text class="label" x="450" y="343" text-anchor="middle">Example number</text>
  <text class="label" x="55" y="210" transform="rotate(-90 55 210)" text-anchor="middle">Target value</text>

  <g stroke="#d55e00" stroke-width="2" stroke-dasharray="4 3">
    <line x1="220" y1="234" x2="220" y2="226"/>
    <line x1="360" y1="274" x2="360" y2="282"/>
    <line x1="500" y1="242" x2="500" y2="242"/>
    <line x1="640" y1="146" x2="640" y2="162"/>
  </g>
  <g fill="#0072B2" stroke="#ffffff" stroke-width="2">
    <circle cx="220" cy="234" r="7"/>
    <circle cx="360" cy="274" r="7"/>
    <circle cx="500" cy="242" r="7"/>
    <circle cx="640" cy="146" r="7"/>
  </g>
  <g fill="#d55e00" stroke="#ffffff" stroke-width="2">
    <circle cx="220" cy="226" r="7"/>
    <circle cx="360" cy="282" r="7"/>
    <circle cx="500" cy="242" r="7"/>
    <circle cx="640" cy="162" r="7"/>
  </g>
  <circle cx="650" cy="100" r="6" fill="#0072B2"/>
  <text class="small" x="662" y="104">Predicted</text>
  <circle cx="745" cy="100" r="6" fill="#d55e00"/>
  <text class="small" x="757" y="104">Observed</text>

  <text x="75" y="390" font-size="17" font-weight="700">Squared residuals</text>
  <g class="grid">
    <line x1="150" y1="535" x2="750" y2="535"/>
    <line x1="150" y1="500" x2="750" y2="500"/>
    <line x1="150" y1="465" x2="750" y2="465"/>
    <line x1="150" y1="430" x2="750" y2="430"/>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="150" y1="420" x2="150" y2="535"/>
    <line x1="150" y1="535" x2="750" y2="535"/>
  </g>
  <g fill="#009E73">
    <rect x="220" y="517.5" width="70" height="17.5" rx="3"/>
    <rect x="350" y="517.5" width="70" height="17.5" rx="3"/>
    <rect x="480" y="535" width="70" height="0" rx="3"/>
    <rect x="610" y="465" width="70" height="70" rx="3"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="255" y="510">0.25</text>
    <text x="385" y="510">0.25</text>
    <text x="515" y="526">0</text>
    <text x="645" y="458">1</text>
    <text x="255" y="555">Example 1</text>
    <text x="385" y="555">Example 2</text>
    <text x="515" y="555">Example 3</text>
    <text x="645" y="555">Example 4</text>
  </g>
  <text class="label" x="450" y="595" text-anchor="middle">MSE = (0.25 + 0.25 + 0 + 1) / 4 = 0.375</text>
</svg>
